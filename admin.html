<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioGlow library admin</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203a32;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:44px auto;padding:0 24px}h1{font-size:32px;margin-bottom:8px}h2{font-size:20px;margin:0 0 8px}p{line-height:1.5}.muted{color:#526960}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}button,select,input{font:inherit;border:1px solid #b7c8bf;border-radius:8px;padding:10px 14px}button{cursor:pointer;background:white;color:#203a32}button:hover:enabled{background:#e6f4eb}button:disabled{opacity:.5;cursor:default}.primary{background:#1d684c;color:white}.admin-row{background:white;border:1px solid #d7e2dc;border-radius:12px;padding:20px;margin:14px 0}.admin-row p{font-size:14px;color:#526960}.admin-row button+button{margin-left:10px}#admin-status{padding:16px;background:#e5efe9;border-radius:10px}dialog{max-width:520px;width:calc(100% - 32px);border:1px solid #bacbc2;border-radius:16px;padding:26px}dialog::backdrop{background:#142c2466}label{display:block}input{display:block;width:100%;margin-top:8px}a{color:#1d684c}[hidden]{display:none!important}:focus-visible{outline:3px solid #277d62;outline-offset:3px}
</style></head><body><main>
<a href="./">← Simulator</a><h1>Shared library admin</h1><p class="muted">Rename programs, archive them from the student list, or restore archived programs. Every change preserves earlier revisions.</p>
<div class="toolbar"><button id="admin-sign-in" class="primary" disabled>Sign in with Google</button><button id="admin-sign-out" disabled>Sign out</button><span id="admin-identity"></span></div>
<p id="admin-status" role="status">Loading admin tools…</p>
<div class="toolbar"><label for="admin-filter">View</label><select id="admin-filter"><option value="active">Active programs</option><option value="archived">Archived programs</option></select><button id="admin-refresh" disabled>Refresh</button></div>
<div id="admin-list"></div><p id="admin-empty" hidden>No programs in this view.</p><button id="admin-more" hidden disabled>Load more</button>
<dialog id="admin-dialog" aria-labelledby="admin-action-title"><h2 id="admin-action-title"></h2><p id="admin-action-text"></p><label id="admin-name-label">New program name<input id="admin-name" maxlength="64" autocomplete="off"></label><p id="admin-action-status" role="status"></p><div class="toolbar"><button id="admin-cancel">Cancel</button><button id="admin-confirm" class="primary">Confirm</button></div></dialog>
</main><script type="module" src="src/admin-app.js?v=2026-10-08-admin1"></script></body></html>
